server.port=8084
spring.datasource.url=jdbc:h2:file:${ENTREPRISE_DATA_DIR:./data}/notification-service
spring.datasource.username=sa
spring.datasource.password=
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:entreprise}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:entreprise-dev}
spring.rabbitmq.connection-timeout=2s

spring.rabbitmq.listener.simple.concurrency=1
spring.rabbitmq.listener.simple.max-concurrency=1
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.connectiontimeout=2000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=3000
entreprise.mail.expediteur=${MAIL_FROM:missions@entreprise.test}
